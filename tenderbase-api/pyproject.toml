[project]
name = "tenderbase-api"
version = "0.1.0"
description = "TenderBase API — normalized South African public procurement intelligence data platform (API only)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.1",
    "greenlet>=3.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pypdf>=4.2",
    "pdfplumber>=0.11",
    "redis>=5.0",
    "arq>=0.26",
    "structlog>=24.1",
    "python-slugify>=8.0",
    # /metrics is part of the API image (there is no sidecar), so the client
    # library is a runtime dependency, not a dev extra.
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]
# Object storage. Optional because the default deployment stores blobs on disk, and an
# app that must start without AWS SDKs is worth more than a tidy dependency list — the
# S3 backend raises a configuration error naming this extra if it is missing.
s3 = ["boto3>=1.34"]
ocr = ["pytesseract>=0.3.10", "pdf2image>=1.17"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
    # tests/unit/test_deployment_artifacts.py parses docker/docker-compose.yml:
    # compose is configuration code, and the only way to catch drift in it is to
    # read the file the way the runtime will.
    "PyYAML>=6.0",
    "ruff>=0.5",
    "mypy>=1.10",
    # The S3 backend is tested against moto, an in-process implementation of the S3
    # API: the assertions cover real request signing and XML parsing without an AWS
    # account, and never depend on network access to it.
    "boto3>=1.34",
    "moto[s3]>=5.0",
    # Queue/retry/rate-limit tests need a real Redis. redislite runs the actual server
    # in-process, so the suite exercises the broker on a machine with none installed.
    "redislite>=6.2",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: hermetic tests with no external dependencies",
    "integration: tests that run against a real database (SQLite by default, PostgreSQL when TEST_DATABASE_URL is set)",
    "connectors: tests that exercise connectors against recorded fixtures",
    "postgres: requires a reachable PostgreSQL server",
    "redis: requires a reachable Redis server",
]
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated Alembic revisions keep their generated formatting.
"migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
